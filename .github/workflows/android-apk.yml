name: Build Auspex APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: auspex-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JetBrains Runtime JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21"
          java-package: jdk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 37.0 SDK and create AGP-compatible alias
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

          # Google publishes API 37.0 under android-37. Some AGP versions
          # still resolve compileSdk 37 using the legacy android-37 directory.
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

          test -f "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug and release APKs
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.UVCCAMERA_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p apk-output
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} apk-output/ \; || true
          ls -lah apk-output

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auspex-apks-${{ github.run_number }}
          path: apk-output/*.apk
          if-no-files-found: warn
          retention-days: 14
