name: Build Auspex APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: auspex-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 SDK
        run: |
          sdkmanager "platforms;android-37"
          yes | sdkmanager --licenses

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug and release APKs
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.UVCCAMERA_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p apk-output
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} apk-output/ \; || true
          ls -lah apk-output

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auspex-apks-${{ github.run_number }}
          path: apk-output/*.apk
          if-no-files-found: warn
          retention-days: 14
